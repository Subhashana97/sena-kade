<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Fresh Mart</title>
<style>
:root{--g:#1f6b3a;--ink:#1c2620;--bg:#f5f7f3;--red:#d7263d;--line:#dfe5dc}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
button{cursor:pointer;background:var(--g);color:#fff;border:0}button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}button.del{background:var(--red)}
button:disabled{opacity:.4;cursor:not-allowed}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;color:var(--g)}header input{flex:1;max-width:420px}
.layout{display:flex;min-height:calc(100vh - 60px)}
aside{width:210px;padding:16px;background:#fff;border-right:1px solid var(--line)}
aside div{padding:9px 10px;border-radius:6px;cursor:pointer}aside div.on{background:var(--g);color:#fff}
main{flex:1;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#e8eee5}
.old{text-decoration:line-through;color:#888;font-size:13px}.price{font-weight:700;font-size:18px}
.badge{position:absolute;top:14px;left:14px;background:var(--red);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:#fff;padding:16px;overflow:auto;box-shadow:-4px 0 20px #0003;z-index:9}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.form{display:grid;gap:8px;max-width:520px}.tabs{display:flex;gap:8px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
@media(max-width:700px){.layout{flex-direction:column}aside{width:100%;display:flex;overflow:auto;gap:6px;border-right:0}aside div{white-space:nowrap}}
</style></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
